<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auramy share card</title>
<!-- 1200×630 share card, built to read as a thumbnail: one window, one line, four very
     different pages. Rendered by tools/render-png.sh → /assets/img/og.png -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Instrument+Serif:ital@1&family=Shantell+Sans:wght,INFM@800,45&family=Unbounded:wght@800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: radial-gradient(120% 90% at 50% 120%, #7ea0ff, transparent 60%), linear-gradient(180deg, #2b5ef0, #1d43d6); color: #161a2e; font-family: "Shantell Sans", system-ui, sans-serif; }

  .win { position: absolute; inset: 18px; overflow: hidden; border: 3px solid #1d3fb5; border-radius: 16px 16px 9px 9px; background: radial-gradient(rgba(47, 94, 246, .16) 1.5px, transparent 2px) 0 0 / 26px 26px, #f8f7f2; box-shadow: 0 18px 40px rgba(6, 22, 90, .45); }
  .bar { display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 10px 0 16px; background: linear-gradient(180deg, #6b95ff 0%, #3466f7 10%, #2d5cf0 50%, #2450dc 88%, #1d40b8 100%); color: #fff; font: 700 28px/1 Tahoma, Verdana, sans-serif; text-shadow: 1px 1px 0 rgba(10, 30, 110, .55); }
  .bar img { width: 38px; height: 38px; border-radius: 8px; }
  .bar b { flex: 1; }
  .bar span { display: grid; place-items: center; width: 40px; height: 40px; border: 2px solid rgba(255, 255, 255, .9); border-radius: 6px; background: linear-gradient(180deg, #6f98ff, #2c5be9); font: 700 22px/1 Tahoma, sans-serif; }
  .bar span.x { background: linear-gradient(180deg, #f39a7a, #d8431f); }

  h1 { position: absolute; left: 56px; top: 146px; font: 800 86px/1.02 "Shantell Sans"; font-variation-settings: "INFM" 45; letter-spacing: -.025em; }
  h1 em { position: relative; display: inline-block; font-style: normal; background: linear-gradient(180deg, transparent 56%, #f6ec22 56% 90%, transparent 90%); }
  h1 svg { position: absolute; left: -7%; top: -16%; width: 114%; height: 136%; overflow: visible; fill: none; stroke: #2541d8; stroke-width: 3.4; stroke-linecap: round; }

  /* four friends, four completely different pages: fanned so every name shows */
  .card { position: absolute; top: 150px; width: 196px; height: 312px; overflow: hidden; border-radius: 18px; box-shadow: 0 22px 44px rgba(18, 48, 143, .3), 0 3px 8px rgba(18, 48, 143, .16); }
  .card img { display: block; width: 100%; height: 64%; object-fit: cover; }
  .card b { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; height: 36%; padding-left: 16px; }
  .cami { left: 596px; transform: rotate(-9deg) translateY(16px); background: linear-gradient(170deg, #f7c27a, #ef7d58); }
  .cami img { width: 84%; height: 58%; margin: 8% 0 0 8%; border: 6px solid #fff4e2; border-radius: 4px; }
  .cami b { padding-left: 14px; color: #1d0f08; font: italic 400 54px/1 "Instrument Serif", serif; }
  .j4y { left: 730px; top: 136px; transform: rotate(-3deg); background: #0b0d0c; box-shadow: 0 0 0 4px #c8ff3d, 0 22px 44px rgba(18, 48, 143, .3); }
  .j4y img { object-fit: contain; padding-top: 14px; background: radial-gradient(circle at 50% 60%, #2a3a12, #0b0d0c 70%); }
  .j4y b { color: #c8ff3d; font: 800 60px/1 -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: -.07em; }
  .mads { left: 864px; transform: rotate(3deg) translateY(8px); background: #2a2c2e; }
  .mads b { padding-left: 10px; background: #f7f4ec; color: #23252a; font: 700 46px/1 "Caveat", cursive; }
  .eagles { left: 974px; transform: rotate(9deg) translateY(26px); background: #0d2b1d; }
  .eagles img { object-position: 52% 30%; }
  .eagles b { justify-content: center; padding: 0; color: #f2c230; font: italic 800 54px/1 "Unbounded", sans-serif; letter-spacing: -.06em; }

  .smile { position: absolute; left: 1036px; top: 74px; width: 110px; height: 110px; transform: rotate(12deg); filter: drop-shadow(0 10px 14px rgba(18, 48, 143, .3)); }
</style>
</head>
<body>
  <div class="win">
    <header class="bar"><img src="/assets/img/brand/auramy-monitor.jpg" alt=""><b>aura.my/you</b><span>_</span><span class="x">×</span></header>
    <h1>A little<br>internet for<br><em>your people.<svg viewBox="0 0 240 100" preserveAspectRatio="none"><path d="M40 22C82 6 162 4 210 24c30 13 30 46-6 60-48 17-128 16-170 2C6 76 0 52 22 36c26-18 86-26 150-22"/></svg></em></h1>

  </div>
</body>
</html>
